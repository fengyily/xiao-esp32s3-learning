; PlatformIO Project Configuration File
;
; 多 Demo 结构（方案 B）：
;   - [env] 是公共段，所有 demo 共享板子/框架/串口配置，避免重复
;   - 每个 [env:demoXX] 只用 build_src_filter 指定自己要编译的源码目录
;   - 烧录某个 demo:  pio run -e demo02 -t upload
;   - 看串口:        pio device monitor
;
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

[env:demo01]
build_src_filter = +<demo01/>

[env:demo02]
build_src_filter = +<demo02/>

[env:demo03]
build_src_filter = +<demo03/>

[env:demo04]
build_src_filter = +<demo04/>

[env:demo05]
build_src_filter = +<demo05/>

[env:demo06]
build_src_filter = +<demo06/>
build_flags =
    -DBOARD_HAS_PSRAM
board_build.arduino.memory_type = qio_opi   ; 让 ESP32-S3 用上 OPI PSRAM

[env:demo07]
build_src_filter = +<demo07/>

[env:demo08]
build_src_filter = +<demo08/>
build_flags =
    -DBOARD_HAS_PSRAM
    -I src/demo07          ; 复用 demo07 的 secrets.h（WiFi 账号密码）
board_build.arduino.memory_type = qio_opi

[env:demo11]
build_src_filter = +<demo11/>
build_flags =
    -DBOARD_HAS_PSRAM
    -I src/demo07          ; 复用 secrets.h（WiFi + 服务器地址）
board_build.arduino.memory_type = qio_opi

[env:demo100]
build_src_filter = +<demo100/>   ; SD 卡加载测试（Sense 板，CS=GPIO21）
